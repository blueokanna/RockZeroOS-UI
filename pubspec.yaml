name: rockzero
description: "RockZeroOS - Secure Cross-Platform Client for Custom NAS"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Material Design 3 & UI
  cupertino_icons: ^1.0.8
  google_fonts: ^7.0.2
  flutter_animate: ^4.5.2
  animations: ^2.0.11

  # State Management - Riverpod 3.0.3 (stable with freezed 3.x)
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # Network & API
  dio: ^5.8.0
  json_annotation: ^4.9.0

  # Cryptography
  pointycastle: ^3.9.1
  crypto: ^3.0.6
  edwards25519: ^1.0.5  # Edwards25519 曲线运算（与 Rust curve25519_dalek 兼容）
  hashlib: ^2.3.0       # SHA3-256, Blake2b, HMAC 等
  thirds: ^0.2.0-alpha.1  # Blake3 支持
  ffi: ^2.1.3  # FFI for Rust native library binding

  # Local Storage & Security
  flutter_secure_storage: ^10.0.0
  flutter_secure_storage_linux: ^3.0.0
  flutter_secure_storage_macos: ^4.0.0
  flutter_secure_storage_windows: ^4.1.0
  flutter_secure_storage_web: ^2.1.0
  shared_preferences: ^2.3.5
  hive_flutter: ^1.1.0

  # Device Discovery (mDNS/UDP)
  multicast_dns: ^0.3.2+6
  network_info_plus: ^7.0.0
  connectivity_plus: ^7.0.0


  # Media & Video/Audio - Using media_kit for better HLS support
  # 注意：Android 平台使用本地 JAR 包（位于 D:\RustProject\RockZeroOS-Service\assets）
  # 避免从 GitHub 下载失败的问题
  # 
  # 本地 JAR 包通过 android/app/build.gradle.kts 中的 copyMediaKitLibs 任务自动复制
  # 支持的架构：arm64-v8a, armeabi-v7a, x86, x86_64
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  # Android 平台库 - 使用本地 JAR 包
  media_kit_libs_android_video: ^1.3.6
  # Windows 平台库
  media_kit_libs_windows_video: ^1.0.9
  # Linux 平台库
  media_kit_libs_linux: ^1.1.3
  # macOS 平台库
  media_kit_libs_macos_video: ^1.1.4
  # iOS 平台库
  media_kit_libs_ios_video: ^1.1.4
  just_audio: ^0.10.5
  photo_view: ^0.15.0
  audio_waveforms: ^2.0.2
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0

  # WebView for in-app browser
  webview_flutter: ^4.10.0

  # File Management
  file_picker: ^10.3.8
  path_provider: ^2.1.5
  open_file: ^3.5.10
  url_launcher: ^6.3.1
  permission_handler: ^12.0.1
  http: ^1.2.2
  image_picker: ^1.1.2

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  logger: ^2.5.0
  freezed_annotation: ^3.1.0
  equatable: ^2.0.7
  go_router: ^17.0.1

  # Markdown rendering
  flutter_markdown: ^0.7.6
  markdown: ^7.2.2

  # System Info
  device_info_plus: ^12.3.0
  package_info_plus: ^9.0.0

  # Screen wake lock
  wakelock_plus: ^1.4.0

  # Desktop window management
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.5
  json_serializable: ^6.9.5
  freezed: ^3.2.3
  riverpod_generator: ^3.0.3
  flutter_launcher_icons: ^0.14.3

# App icon configuration
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/RockZero.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1a1a2e"
  adaptive_icon_foreground: "assets/images/RockZero.png"
  web:
    generate: true
    image_path: "assets/images/RockZero.png"
  windows:
    generate: true
    image_path: "assets/images/RockZero.png"
  macos:
    generate: true
    image_path: "assets/images/RockZero.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
