name: rockzero
description: "RockZero OS - Secure Cross-Platform Client"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Material Design 3 & UI
  cupertino_icons: ^1.0.8
  google_fonts: ^7.0.0
  flutter_animate: ^4.5.2
  animations: ^2.0.11
  
  # State Management
  flutter_riverpod: ^3.1.0
  
  # Network & API
  dio: ^5.7.0
  json_annotation: ^4.9.0
  
  # Local Storage & Security
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.3.5
  hive_flutter: ^1.1.0
  
  # Device Discovery (mDNS/UDP)
  multicast_dns: ^0.3.2+6
  network_info_plus: ^7.0.0
  connectivity_plus: ^7.0.0
  
  # Media & Hardware Acceleration
  video_player: ^2.9.2
  chewie: ^1.10.0
  just_audio: ^0.10.5
  
  # File Management
  file_picker: ^10.3.8
  path_provider: ^2.1.5
  open_file: ^3.5.10
  url_launcher: ^6.3.1
  
  # Biometric & Security (mobile only - disabled for cross-platform compatibility)
  # local_auth: ^3.0.0  # Uncomment for Android/iOS biometric support
  
  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  logger: ^2.5.0
  freezed_annotation: ^3.1.0
  equatable: ^2.0.7
  go_router: ^17.0.1
  
  # System Info
  device_info_plus: ^12.3.0
  package_info_plus: ^9.0.0
  
  # Screen wake lock
  wakelock_plus: ^1.2.10
  
  # Desktop window management
  window_manager: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.9.2
  freezed: ^3.2.4

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
