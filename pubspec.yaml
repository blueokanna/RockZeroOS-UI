name: rockzero
description: "RockZero OS - Secure Cross-Platform Client"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0-200.1.beta

dependencies:
  flutter:
    sdk: flutter

  # Material Design 3 & UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  animations: ^2.0.11
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Network & API
  dio: ^5.4.3+1
  json_annotation: ^4.9.0
  
  # Local Storage & Security
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Device Discovery (mDNS/UDP)
  multicast_dns: ^0.3.2+6
  network_info_plus: ^5.0.3
  connectivity_plus: ^6.0.3
  
  # Media & Hardware Acceleration
  video_player: ^2.9.1
  chewie: ^1.8.1
  just_audio: ^0.9.39
  
  # File Management
  file_picker: ^8.0.3
  path_provider: ^2.1.3
  open_file: ^3.5.3
  
  # Biometric & Security
  local_auth: ^2.2.0
  
  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0
  logger: ^2.3.0
  freezed_annotation: ^2.4.1
  equatable: ^2.0.5
  go_router: ^14.2.0
  
  # System Info
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  freezed: ^2.5.2

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
