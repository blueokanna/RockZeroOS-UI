# ============================================================================
# media_kit 本地库配置
# ============================================================================
# 
# 此文件配置 media_kit 原生库的本地路径
# 避免从 GitHub 下载失败的问题
#
# 使用方法：
# 1. 将 media_kit JAR 包放置到指定目录
# 2. 修改下面的路径指向你的 JAR 包目录
# 3. 运行 flutter build 或 flutter run
#
# 所需的 JAR 文件：
# - full-arm64-v8a.jar    (ARM64 架构)
# - full-armeabi-v7a.jar  (ARM32 架构)
# - full-x86.jar          (x86 架构，模拟器)
# - full-x86_64.jar       (x86_64 架构，模拟器)
#
# ============================================================================

# 本地 assets 目录路径（包含 media_kit JAR 包）
# Windows 路径使用正斜杠或双反斜杠
media_kit.local_assets_dir=D:/RustProject/RockZeroOS-Service/assets

# 是否启用本地库加载（true/false）
media_kit.use_local_libs=true

# FFmpeg 压缩包路径（可选，用于后端服务）
ffmpeg.archive_path=D:/RustProject/RockZeroOS-Service/assets/ffmpeg-release-arm64-static.tar.xz
